[colors]
include-file = ~/.config/polybar/colors.ini

[bar/down-panel]
; bottom = true
bottom = true
width = 100%

override-redirect = false
wm-restack = bspwm
#wm-restack = bspwm
#height = 24pt
height = 32
#radius = 6

; dpi = 96

background = ${colors.bg0}
border-top-size = 0
border-bottom-size = 0
border-left-size = 0
border-right-size = 0
border-top-color = ${colors.bg}
foreground = ${colors.fg}

line-size = 3pt
#line-size = 5pt

#border-size = 4pt
border-color = #00000000

padding-left = 0
padding-right = 0

module-margin = 0

#separator = "  "
#separator-foreground = ${colors.bg}

#font-0 = Liberation Sans;2
#font-1 = JetBrainsMono Nerd Font;2
#font-2 = Symbols Nerd Font;2
font-0 = "JetBrainsMono:style=Bold:size=10;2"
font-6 = "JetBrainsMono:style=Bold:size=10;2"
font-7 = "MesloLGS NF:style=Regular:size=32;2"
font-1 = "JetBrainsMono Nerd Font:size=10;2"
#font-2 = Symbols Nerd Font Mono:size=11;3
font-2 = Symbols Nerd Font:size=15;2
font-3 = MesloLGS NF:style=Regular:size=30;4
font-4 = Symbols Nerd Font:size=15;2
font-5 = DejaVu Sans:pixelsize=30;3

#modules-left = xworkspaces end1
modules-left = control-panel biy xworkspaces bir systray biy xkeyboard bir xwindow bdgg2
; modules-center = date
#modules-right = end2 systray spacer pulseaudio spacer xkeyboard spacer wlan eth spacer date
; modules-right = bdy updates bdr cpu bdp memory battery bdr pulseaudio bdp wlan eth bdr date

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

[bar/up-panel]
; bottom = true
top = true
width = 100%

override-redirect = false
wm-restack = bspwm
#wm-restack = bspwm
#height = 24pt
height = 32
#radius = 6

; dpi = 96

background = ${colors.bg0}
border-top-size = 0
border-bottom-size = 0
border-left-size = 0
border-right-size = 0
border-top-color = ${colors.bg}
foreground = ${colors.fg}

line-size = 3pt
#line-size = 5pt

#border-size = 4pt
border-color = #00000000

padding-left = 0
padding-right = 0

module-margin = 0

#separator = "  "
#separator-foreground = ${colors.bg}

#font-0 = Liberation Sans;2
#font-1 = JetBrainsMono Nerd Font;2
#font-2 = Symbols Nerd Font;2
font-0 = "JetBrainsMono:style=Bold:size=10;2"
font-6 = "JetBrainsMono:style=Bold:size=10;2"
font-7 = "MesloLGS NF:style=Regular:size=32;2"
font-1 = "JetBrainsMono Nerd Font:size=10;2"
#font-2 = Symbols Nerd Font Mono:size=11;3
font-2 = Symbols Nerd Font:size=15;2
font-3 = MesloLGS NF:style=Regular:size=30;4
font-4 = Symbols Nerd Font:size=15;2
font-5 = DejaVu Sans:pixelsize=30;3

#modules-left = xworkspaces end1
; modules-left = control-panel spacer xworkspaces spacer systray end1 xwindow 
; modules-center = date
#modules-right = end2 systray spacer pulseaudio spacer xkeyboard spacer wlan eth spacer date
modules-right = bdy updates bdr cpu bdp memory battery bdr pulseaudio bdp wlan eth bdr date

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

; wm-restack = generic
; wm-restack = bspwm
; wm-restack = i3

; override-redirect = true

; This module is not active by default (to enable it, add it to one of the
; modules-* list above).
; Please note that only a single tray can exist at any time. If you launch
; multiple bars with this module, only a single one will show it, the others
; will produce a warning. Which bar gets the module is timing dependent and can
; be quite random.
; For more information, see the documentation page for this module:
; https://polybar.readthedocs.io/en/stable/user/modules/tray.html
[module/control-panel]
type = custom/text

format-background = ${colors.bg}

label = " PNL"

click-left = ~/.config/bspwm/bin/control-panel.sh

[module/updates]
type = custom/script

exec = ~/.config/bspwm/bin/updates.sh --scan
interval = 300

format-prefix = "UPD: "
format-background = ${colors.bg}
label-background = ${colors.bg}

label = %output%

click-left = ~/.config/bspwm/bin/updates.sh --update

[module/systray]
type = internal/tray

format-background = ${colors.bg}
tray-background = ${colors.bg}

#format-margin = 8pt
tray-spacing = 5pt

[module/xworkspaces]
type = internal/xworkspaces

icon-0 = I;ONE
icon-1 = II;TWO
icon-2 = III;THREE
icon-3 = IV;FOUR
icon-4 = V;FIVE
icon-5 = VI;SIX

label-active = " [%icon%] "
label-active-padding = 0
label-active-background = ${colors.bg-alt}
label-active-foreground = ${colors.fg}

label-occupied = " %icon% "
label-occupied-padding = 0
label-occupied-background = ${colors.bg-alt}
label-occupied-foreground = ${colors.fg}

label-urgent = " [%icon%] "
label-urgent-padding = 0
label-urgent-background = ${colors.bg-alt}
label-urgent-foreground = ${colors.primary}

label-empty = " %icon% "
label-empty-padding = 0
label-empty-background = ${colors.bg-alt}
label-empty-foreground = ${colors.disabled}

#[module/xworkspaces]
#type = internal/xworkspaces

#label-active = %name%
#label-active-background = ${colors.bg}
#label-active-foreground = ${colors.primary}
#label-active-padding = 2

#label-occupied = %name%
#label-occupied-background = ${colors.bg}
#label-occupied-padding = 2

#label-urgent = %name%
#label-urgent-background = ${colors.alert}
#label-urgent-padding = 2

#label-empty = %name%
#label-empty-foreground = ${colors.disabled}
#label-empty-background = ${colors.bg}
#label-empty-padding = 2

[module/xwindow]
type = internal/xwindow
label = "%{T7}%title:0:28:...%"
format-foreground = ${colors.fg}
format-background = ${colors.bg}

[module/filesystem]
type = internal/fs
interval = 25

mount-0 = /

label-mounted =     %percentage_used%%

label-unmounted = %mountpoint% not mounted
label-unmounted-foreground = ${colors.disabled}

[module/pulseaudio]
type = internal/pulseaudio

format-volume-prefix = "VOL: "
format-volume-prefix-background = ${colors.bg-alt}
format-volume = <label-volume>

label-volume = %{T7}%percentage%%{T-}
label-volume-background = ${colors.bg-alt}

label-muted = "MUTED"
label-muted-foreground = ${colors.disabled}
label-muted-background = ${colors.bg-alt}

[module/xkeyboard]
type = internal/xkeyboard

blacklist-0 = num lock
blacklist-1 = caps lock

label-layout = %layout%
label-layout-background = ${colors.bg-alt}

#label-indicator-padding = 2
#label-indicator-margin = 1
label-indicator-background = ${colors.bg-alt}

[module/memory]
type = internal/memory
interval = 2

format-background = ${colors.bg}

format-prefix = "MEM: "

label = %{T7}%percentage_used:2%%{T-}

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "CPU: "
format-background = ${colors.bg-alt}
label = %{T7}%percentage:2%%{T-}

[network-base]
type = internal/network
interval = 1
speed-unit =

format-connected = <label-connected>
format-connected-background = ${colors.bg}

format-disconnected = <label-disconnected>
format-disconnected-background = ${colors.bg}

label-connected = "NET: %{T7}%downspeed%%{T-} %{T7}%upspeed%%{T-}"
label-disconnected = disconnected

[module/wlan]
inherit = network-base
interface-type = wireless

[module/eth]
inherit = network-base
interface-type = wired

[module/date]
type = internal/date
interval = 1

date = "%{T7}%a %d %b %I:%M %p%{T-} "

label = %date%
label-foreground = ${colors.fg}

format-background = ${colors.bg-alt}

[settings]
screenchange-reload = true
pseudo-transparency = true

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC

format-charging-background = ${colors.bg}
format-discharging-background = ${colors.bg}
format-full-background = ${colors.bg}

format-charging-prefix = "  %{T5}󰂄%{T-}"
format-charging-prefix-foreground = ${colors.primary}

format-discharging-prefix = "  %{T5}󱈏%{T-}"
format-discharging-prefix-foreground = ${colors.primary}

format-full-prefix = "  %{T5}󱈏%{T-} "
format-full-prefix-foreground = ${colors.primary}

label-charging = %{T7}%percentage%
label-discharging = %{T7}%percentage%
label-full = %{T7}%percentage%

[module/spacer]
type = custom/text

label = "   "
label-background = ${colors.bg}

[module/biy]
type = custom/text
label = "%{T8}%{T-}"
label-foreground = ${colors.bg-alt}
label-background = ${colors.bg}

[module/bir]
type = custom/text
label = "%{T8}%{T-}"
label-foreground = ${colors.bg}
label-background = ${colors.bg-alt}

[module/bdgg2]
type = custom/text
label = "%{T8}%{T-}"
label-foreground = ${colors.bg}
label-background = ${colors.bg0}

[module/bdv]
type = custom/text
label = "%{T3}%{T-}"
label-foreground = ${colors.bg-alt}
label-background = ${colors.bg}

[module/bdv2]
