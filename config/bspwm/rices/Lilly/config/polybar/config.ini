label = "%{T3}%{T-}"
label-foreground = ${colors.bg-alt}
label-background = ${colors.bg}

[module/bdv3]
type = custom/text
label = "%{T3}%{T-}"
label-foreground = ${colors.grey}
label-background = ${colors.bg}

[module/bdy]
type = custom/text
label = "%{T8}%{T-}"
label-foreground = ${colors.bg}
label-background = ${colors.bg0}

[module/bdr]
type = custom/text
label = "%{T8}%{T-}"
label-foreground = ${colors.bg}
label-background = ${colors.bg-alt}

[module/bdp]
type = custom/text
label = "%{T8}%{T-}"
label-foreground = ${colors.bg}
label-background = ${colors.bg-alt}

[module/bdc]
type = custom/text
label = "%{T3}%{T-}"
label-foreground = ${colors.bg-alt}
